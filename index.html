<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>需要密碼</title>
<meta name="theme-color" content="#2f2a26">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='86'>🔒</text></svg>">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem;
    background: #f4f1ea; color: #2f2a26;
    font: 17px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #1c1a17; color: #ece6da; } }
  .box {
    width: 100%; max-width: 26rem; text-align: center;
    background: #fff; border: 2px solid #e2dccf; border-radius: 20px; padding: 2rem 1.5rem;
    box-shadow: 0 8px 30px rgba(0,0,0,.07);
  }
  @media (prefers-color-scheme: dark) { .box { background: #26231f; border-color: #3b362f; } }
  .lk { font-size: 3rem; line-height: 1; margin-bottom: .6rem; }
  h1 { margin: 0 0 .4rem; font-size: 1.2rem; }
  p.sub { margin: 0 0 1.4rem; font-size: .9rem; color: #7d7568; }
  @media (prefers-color-scheme: dark) { p.sub { color: #a49d92; } }
  form { display: grid; gap: .7rem; }
  input {
    font: inherit; text-align: center; padding: .8rem; width: 100%;
    border: 2px solid #e2dccf; border-radius: 12px; background: #faf8f3; color: inherit;
  }
  @media (prefers-color-scheme: dark) { input { background: #1c1a17; border-color: #3b362f; } }
  input:focus { outline: none; border-color: #c98b52; }
  button {
    font: inherit; font-weight: 700; padding: .8rem; cursor: pointer;
    border: 0; border-radius: 12px; background: #c98b52; color: #fff;
  }
  button:disabled { opacity: .55; cursor: default; }
  .msg { min-height: 1.6rem; font-size: .9rem; margin-top: .8rem; }
  .msg.bad { color: #c4453a; font-weight: 700; }
  .msg.busy { color: #7d7568; }
  .shake { animation: sh .35s; }
  @keyframes sh { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  noscript { display: block; margin-top: 1rem; color: #c4453a; font-size: .9rem; }
</style>
</head>
<body>

<div class="box" id="box">
  <div class="lk">🔒</div>
  <h1>這一頁需要密碼</h1>

    <button type="submit" id="go">開啟</button>
  </form>

</div>

  var KEY = 'unlock:' + location.pathname;

  var f = document.getElementById('f'),
      pw = document.getElementById('pw'),
      go = document.getElementById('go'),
      msg = document.getElementById('msg'),
      box = document.getElementById('box');

  function b2u(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }

  function decrypt(pass) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b2u(P.salt), iterations: P.iter, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b2u(P.iv) }, key, b2u(P.ct));
      })
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  function show(html) {
    /* 解出來的是一份完整的 HTML，用 document.write 換掉整份文件，
       裡面的 <script> 才會照常執行（勾選清單、計數器都靠它）。 */
    document.open();
    document.write(html);
    document.close();
  }

  function attempt(pass, silent) {
    go.disabled = true;
    msg.className = 'msg busy';
    msg.textContent = '解開中…';
    /* 推金鑰要跑 60 萬次雜湊，會卡住畫面一下，先讓瀏覽器把「解開中」畫出來 */
    setTimeout(function () {
      decrypt(pass).then(function (html) {
        try { sessionStorage.setItem(KEY, pass); } catch (e) {}
        show(html);
      }).catch(function () {
        try { sessionStorage.removeItem(KEY); } catch (e) {}
        go.disabled = false;
        if (silent) { msg.className = 'msg'; msg.textContent = ''; return; }
        msg.className = 'msg bad';
        msg.textContent = '密碼不對，再試一次。';
        box.classList.remove('shake');
        void box.offsetWidth;
        box.classList.add('shake');
        pw.select();
      });
    }, 50);
  }

  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = pw.value.trim();
    if (!v) return;
    attempt(v, false);
  });

  if (!window.crypto || !crypto.subtle) {
    msg.className = 'msg bad';
    msg.textContent = '這個瀏覽器不支援解密，請換 Chrome、Edge 或 Safari。';
    go.disabled = true;
    return;
  }

  /* 同一個分頁重新整理不用再打一次；關掉分頁就忘記 */
  var remembered = null;
  try { remembered = sessionStorage.getItem(KEY); } catch (e) {}
  if (remembered) attempt(remembered, true);
})();
</script>
